plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.oldcucumber.oppocastunlock'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'com.oldcucumber.oppocastunlock'
        minSdk 28
        targetSdk 36
        versionCode 20001
        versionName '2.0.0-fix1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    sourceSets {
        main { manifest.srcFile 'AndroidManifest.xml'; java.srcDirs = ['src']; res.srcDirs = ['res']; assets.srcDirs = ['assets'] }
        test { java.srcDirs = ['test'] }
        androidTest { java.srcDirs = ['androidTest'] }
    }
    def localStore = rootProject.file('work/build/Old_cucumber.jks')
    def storePath = System.getenv('SIGNING_STORE_FILE')
    if (storePath || localStore.exists()) {
        signingConfigs {
            moduleRelease {
                storeFile storePath ? file(storePath) : localStore
                storePassword System.getenv('SIGNING_STORE_PASSWORD') ?: 'old_cucumber'
                keyAlias System.getenv('SIGNING_KEY_ALIAS') ?: 'old_cucumber'
                keyPassword System.getenv('SIGNING_KEY_PASSWORD') ?: 'old_cucumber'
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs.findByName('moduleRelease')) signingConfig signingConfigs.moduleRelease
        }
        debug { if (signingConfigs.findByName('moduleRelease')) signingConfig signingConfigs.moduleRelease }
    }
    buildFeatures { compose true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    packaging {
        dex { useLegacyPackaging true }
        resources.excludes += ['META-INF/AL2.0', 'META-INF/LGPL2.1']
    }
    lint { abortOnError true }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.compose.ui:ui:1.9.4'
    implementation 'androidx.compose.foundation:foundation:1.9.4'
    implementation 'androidx.compose.material3:material3:1.5.0-alpha06'
    implementation 'androidx.compose.material:material-icons-core:1.7.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4:1.9.4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest:1.9.4'
}
